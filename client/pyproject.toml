[project]
name = "flashpoint"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "blake3>=1.0",
  "click>=8.0",
  "httpx>=0.27",
]

[project.scripts]
flashpoint = "flashpoint:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["."]
