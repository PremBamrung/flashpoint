[project]
name = "flashpoint-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "blake3>=1.0",
  "watchdog>=4.0",
  "apscheduler>=3.10",
  "pydantic-settings>=2.0",
]

[project.scripts]
flashpoint-server = "app.main:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
